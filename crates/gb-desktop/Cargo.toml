[package]
name = "gb-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
cpal = "0.16"
gb-core = { path = "../gb-core" }
pixels = "0.15"
thiserror = "2.0"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5.2", features = ["relax-sign-encoding"] }
objc2-app-kit = { version = "0.2.2", features = [
  "NSApplication",
  "NSCell",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
] }
objc2-foundation = { version = "0.2.2", features = [
  "NSObjCRuntime",
  "NSString",
] }
